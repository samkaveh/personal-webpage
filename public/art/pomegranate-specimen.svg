<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" role="img" aria-labelledby="spTitle spDesc">
  <title id="spTitle">Punica granatum — Botanical Specimen Plate</title>
  <desc id="spDesc">An exquisite botanical ink drawing of a pomegranate branch with foliage, whole fruit with calyx crown, dissected fruit displaying seed chambers, and flowering blossom.</desc>

  <defs>
    <radialGradient id="pomGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b08a4a" stop-opacity="0.12" />
      <stop offset="55%" stop-color="#8c1f2c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3f3229" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="seedGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d45b6a" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#8c1f2c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4a0e16" stop-opacity="0.9" />
    </radialGradient>
  </defs>

  <!-- Specimen Plate Guidelines and Framing Ticks -->
  <g stroke="#3f3229" stroke-opacity="0.22" stroke-width="0.75" fill="none">
    <path d="M 18 18 H 34 M 18 18 V 34" />
    <path d="M 342 18 H 326 M 342 18 V 34" />
    <path d="M 18 442 H 34 M 18 442 V 426" />
    <path d="M 342 442 H 326 M 342 442 V 426" />
    <!-- Center coordinate tick -->
    <path d="M 180 14 V 20 M 180 440 V 446 M 12 230 H 18 M 342 230 H 348" stroke-dasharray="1 3" />
  </g>

  <!-- Scientific Plate Taxonomy Typography -->
  <g font-family="var(--mono), 'IBM Plex Mono', monospace" font-size="7.5" fill="#8a7a6b" letter-spacing="0.16em" text-anchor="middle">
    <text x="180" y="28">HERBARIUM SPECIMEN · TAB. IV</text>
    <text x="180" y="438">PUNICA GRANATUM L. — LYTHRACEAE</text>
  </g>

  <!-- MAIN BOTANICAL ILLUSTRATION (Ink & Wash) -->
  <g fill="none" stroke="#3f3229" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. WOODY BRANCH AND TWIGS -->
    <g>
      <!-- Main stem with variable thickness and bark striations -->
      <path d="M 28 82 C 72 96 118 78 168 62 C 218 48 266 52 328 72" stroke-width="1.8" stroke-opacity="0.85" />
      <path d="M 30 84 C 74 98 120 80 170 64 C 219 50 267 54 326 74" stroke-width="0.7" stroke-opacity="0.4" />
      <!-- Bark texture striations -->
      <path d="M 52 87 C 58 88 66 87 72 86" stroke-width="0.5" stroke-opacity="0.4" />
      <path d="M 94 82 C 102 81 112 78 120 75" stroke-width="0.5" stroke-opacity="0.4" />
      <path d="M 142 69 C 150 67 158 64 164 63" stroke-width="0.5" stroke-opacity="0.4" />
      <path d="M 226 53 C 234 53 244 55 252 56" stroke-width="0.5" stroke-opacity="0.4" />
      <path d="M 282 61 C 290 63 298 67 306 70" stroke-width="0.5" stroke-opacity="0.4" />

      <!-- Sub-branches and pedicels -->
      <!-- Fruit stem -->
      <path d="M 166 63 C 164 88 156 118 152 142" stroke-width="1.6" stroke-opacity="0.8" />
      <path d="M 164 64 C 162 88 154 118 150 142" stroke-width="0.6" stroke-opacity="0.35" />
      <path d="M 148 140 C 144 144 156 148 154 152" stroke-width="1.1" stroke-opacity="0.7" />

      <!-- Upper twig leading to flower -->
      <path d="M 264 52 C 278 40 294 30 312 26" stroke-width="1.2" stroke-opacity="0.75" />
      <path d="M 292 32 C 304 46 312 66 316 88" stroke-width="1.1" stroke-opacity="0.7" />

      <!-- Lateral leaf stems -->
      <path d="M 98 87 L 88 98" stroke-width="1" stroke-opacity="0.7" />
      <path d="M 132 73 L 138 90" stroke-width="0.9" stroke-opacity="0.7" />
      <path d="M 224 53 L 230 68" stroke-width="1" stroke-opacity="0.7" />
    </g>

    <!-- 2. BOTANICAL FOLIAGE (LEAVES WITH SECONDARY VENATION) -->
    <!-- Leaf 1: Far left hanging leaf -->
    <g transform="translate(86 96) rotate(42)">
      <path d="M 0 0 C 18 -16 48 -14 68 0 C 48 14 18 16 0 0 Z"
            fill="#6d7a57" fill-opacity="0.12" stroke-width="1.0" stroke-opacity="0.8" />
      <!-- Midrib -->
      <path d="M 2 0 C 22 -1 46 0 64 0" stroke-width="0.75" stroke-opacity="0.6" />
      <!-- Lateral veins -->
      <path d="M 14 0 C 18 -4 24 -7 30 -7" stroke-width="0.5" stroke-opacity="0.45" />
      <path d="M 16 0 C 20 4 26 7 32 7" stroke-width="0.5" stroke-opacity="0.45" />
      <path d="M 28 0 C 33 -4 40 -6 46 -6" stroke-width="0.5" stroke-opacity="0.45" />
      <path d="M 30 0 C 35 4 42 6 48 6" stroke-width="0.5" stroke-opacity="0.45" />
      <path d="M 44 0 C 48 -3 53 -4 58 -3" stroke-width="0.5" stroke-opacity="0.4" />
      <path d="M 45 0 C 49 3 54 4 59 3" stroke-width="0.5" stroke-opacity="0.4" />
    </g>

    <!-- Leaf 2: Upper left ascending leaf -->
    <g transform="translate(112 80) rotate(-28)">
      <path d="M 0 0 C 16 -14 42 -12 60 0 C 42 12 16 14 0 0 Z"
            fill="#6d7a57" fill-opacity="0.11" stroke-width="0.95" stroke-opacity="0.8" />
      <path d="M 2 0 C 20 -1 40 0 56 0" stroke-width="0.7" stroke-opacity="0.6" />
      <path d="M 12 0 C 16 -3 22 -5 28 -5" stroke-width="0.45" stroke-opacity="0.4" />
      <path d="M 14 0 C 18 3 24 5 30 5" stroke-width="0.45" stroke-opacity="0.4" />
      <path d="M 26 0 C 31 -3 37 -5 43 -5" stroke-width="0.45" stroke-opacity="0.4" />
      <path d="M 28 0 C 33 3 39 5 45 5" stroke-width="0.45" stroke-opacity="0.4" />
    </g>

    <!-- Leaf 3: Mid stem arching leaf -->
    <g transform="translate(202 54) rotate(-8)">
      <path d="M 0 0 C 20 -16 52 -14 74 0 C 52 14 20 16 0 0 Z"
            fill="#6d7a57" fill-opacity="0.13" stroke-width="1.0" stroke-opacity="0.8" />
      <path d="M 3 0 C 24 -1 50 0 70 0" stroke-width="0.8" stroke-opacity="0.6" />
      <path d="M 16 0 C 21 -4 28 -8 36 -8" stroke-width="0.5" stroke-opacity="0.45" />
      <path d="M 18 0 C 23 4 30 8 38 8" stroke-width="0.5" stroke-opacity="0.45" />
      <path d="M 32 0 C 38 -4 46 -7 54 -7" stroke-width="0.5" stroke-opacity="0.45" />
      <path d="M 34 0 C 40 4 48 7 56 7" stroke-width="0.5" stroke-opacity="0.45" />
      <path d="M 48 0 C 53 -3 60 -5 66 -4" stroke-width="0.45" stroke-opacity="0.4" />
      <path d="M 50 0 C 55 3 62 5 67 4" stroke-width="0.45" stroke-opacity="0.4" />
    </g>

    <!-- Leaf 4: Upper right small tender leaf -->
    <g transform="translate(274 46) rotate(32)">
      <path d="M 0 0 C 13 -12 36 -10 50 0 C 36 10 13 12 0 0 Z"
            fill="#6d7a57" fill-opacity="0.10" stroke-width="0.9" stroke-opacity="0.75" />
      <path d="M 2 0 C 16 -1 34 0 46 0" stroke-width="0.65" stroke-opacity="0.55" />
      <path d="M 12 0 C 16 -3 22 -5 27 -5" stroke-width="0.45" stroke-opacity="0.4" />
      <path d="M 14 0 C 18 3 24 5 29 5" stroke-width="0.45" stroke-opacity="0.4" />
      <path d="M 24 0 C 28 -3 34 -4 39 -4" stroke-width="0.45" stroke-opacity="0.4" />
      <path d="M 26 0 C 30 3 36 4 41 4" stroke-width="0.45" stroke-opacity="0.4" />
    </g>

    <!-- Leaf 5: Twig leaf near fruit -->
    <g transform="translate(216 172) rotate(18)">
      <path d="M 0 0 C 15 -14 40 -12 56 0 C 40 12 15 14 0 0 Z"
            fill="#6d7a57" fill-opacity="0.11" stroke-width="0.95" stroke-opacity="0.78" />
      <path d="M 2 0 C 18 -1 38 0 52 0" stroke-width="0.7" stroke-opacity="0.55" />
      <path d="M 12 0 C 16 -3 22 -6 28 -6" stroke-width="0.45" stroke-opacity="0.4" />
      <path d="M 14 0 C 18 3 24 6 30 6" stroke-width="0.45" stroke-opacity="0.4" />
      <path d="M 26 0 C 31 -3 37 -5 43 -5" stroke-width="0.45" stroke-opacity="0.4" />
      <path d="M 28 0 C 33 3 39 5 45 5" stroke-width="0.45" stroke-opacity="0.4" />
    </g>

    <!-- 3. WHOLE POMEGRANATE SPECIMEN (Fig. A) -->
    <g>
      <!-- Subtle radial volume wash -->
      <circle cx="154" cy="232" r="62" fill="url(#pomGlow)" stroke="none" />

      <!-- Fruit outer contour with natural asymmetric curvature -->
      <path d="M 152 170 C 188 168 214 192 216 226 C 218 262 196 295 156 300 C 116 305 88 274 86 238 C 84 200 114 171 152 170 Z"
            fill="#8c1f2c" fill-opacity="0.065" stroke-width="1.5" stroke-opacity="0.88" />

      <!-- Botanical shading hatch lines on shadowed lower-left quadrant -->
      <g stroke-width="0.55" stroke-opacity="0.32">
        <path d="M 94 228 C 96 248 108 268 126 280" />
        <path d="M 98 238 C 102 256 114 274 134 286" />
        <path d="M 104 250 C 110 266 124 280 144 290" />
        <path d="M 114 264 C 122 276 136 288 152 294" />
        <path d="M 188 206 C 196 222 198 244 192 262" stroke-opacity="0.22" />
        <path d="M 194 216 C 200 230 202 248 196 264" stroke-opacity="0.18" />
      </g>

      <!-- Persistent Calyx Crown (5 flared triangular serrations) -->
      <g stroke-width="1.2" stroke-opacity="0.85">
        <!-- Center crown sepal -->
        <path d="M 152 170 L 150 146 C 152 142 154 142 156 146 L 154 170" />
        <!-- Left inner sepal -->
        <path d="M 142 170 L 136 150 C 139 148 143 149 146 154 L 148 170" />
        <!-- Right inner sepal -->
        <path d="M 158 170 L 160 152 C 163 148 167 148 170 152 L 164 170" />
        <!-- Far left flared sepal -->
        <path d="M 134 172 C 128 162 120 156 116 154 C 122 158 130 164 136 172" />
        <!-- Far right flared sepal -->
        <path d="M 170 172 C 176 164 184 158 190 154 C 186 160 178 166 172 172" />
        <!-- Crown cavity rim -->
        <path d="M 136 171 C 144 174 162 174 170 171" stroke-width="0.8" stroke-opacity="0.55" />
        <!-- Dried floral style remnant inside crown -->
        <path d="M 153 169 V 158 M 150 162 H 156" stroke-width="0.65" stroke-opacity="0.45" />
      </g>

      <!-- Specimen Figure Label A -->
      <text x="76" y="238" font-family="var(--mono), monospace" font-size="7" fill="#8a7a6b" letter-spacing="0.1em">Fig. A</text>
    </g>

    <!-- 4. POMEGRANATE BLOSSOM IN FULL FLOWER (Upper Right) -->
    <g transform="translate(312 88) rotate(-12) scale(0.95)">
      <!-- Calyx tube / receptacle -->
      <path d="M -8 18 C -10 10 -8 2 0 -6 C 8 2 10 10 8 18 Z"
            fill="#8c1f2c" fill-opacity="0.12" stroke-width="1.1" stroke-opacity="0.85" />
      <!-- Calyx lobes (serrated teeth) -->
      <path d="M -8 4 L -16 -4 L -8 -1 L 0 -10 L 8 -1 L 16 -4 L 8 4" stroke-width="0.9" stroke-opacity="0.8" />
      <!-- Delicate crinkled scarlet petals -->
      <path d="M -12 -3 C -18 -14 -10 -24 -2 -26 C 2 -18 -4 -10 -8 -1" fill="#8c1f2c" fill-opacity="0.15" stroke-width="0.8" stroke-opacity="0.75" />
      <path d="M -2 -26 C 6 -30 16 -24 14 -14 C 8 -10 0 -8 -2 -26" fill="#8c1f2c" fill-opacity="0.14" stroke-width="0.8" stroke-opacity="0.75" />
      <path d="M 8 -1 C 16 -6 24 -2 22 8 C 14 8 8 4 8 -1" fill="#8c1f2c" fill-opacity="0.12" stroke-width="0.75" stroke-opacity="0.7" />
      <!-- Dense bundle of delicate stamens & anthers -->
      <g stroke="#3f3229" stroke-width="0.5" stroke-opacity="0.65">
        <path d="M -2 -6 L -6 -18 M -1 -6 L -2 -20 M 0 -6 L 2 -21 M 1 -6 L 6 -19 M 2 -6 L 9 -16 M -1 -6 L -9 -14" />
        <!-- Golden anthers -->
        <circle cx="-6" cy="-18" r="1.1" fill="#b08a4a" stroke="none" />
        <circle cx="-2" cy="-20" r="1.1" fill="#b08a4a" stroke="none" />
        <circle cx="2" cy="-21" r="1.1" fill="#b08a4a" stroke="none" />
        <circle cx="6" cy="-19" r="1.1" fill="#b08a4a" stroke="none" />
        <circle cx="9" cy="-16" r="1.1" fill="#b08a4a" stroke="none" />
        <circle cx="-9" cy="-14" r="1.1" fill="#b08a4a" stroke="none" />
      </g>
      <text x="-22" y="24" font-family="var(--mono), monospace" font-size="6.5" fill="#8a7a6b" letter-spacing="0.1em">Fig. B</text>
    </g>

    <!-- 5. DISSECTED POMEGRANATE CROSS-SECTION (Lower Right Specimen Fig. C) -->
    <g transform="translate(254 336)">
      <!-- Outer pericarp rind thickness -->
      <circle r="44" fill="#8c1f2c" fill-opacity="0.06" stroke-width="1.4" stroke-opacity="0.85" />
      <circle r="41" stroke-width="0.8" stroke-opacity="0.45" />
      <circle r="36" stroke-width="0.65" stroke-dasharray="2 3" stroke-opacity="0.35" />

      <!-- Spongy white albedo membrane & radial septa dividing 5 chambers -->
      <g stroke-width="0.85" stroke-opacity="0.55">
        <!-- Septa radiating from central placental core -->
        <path d="M 0 -6 C 3 -18 1 -28 0 -36" />
        <path d="M 5 -2 C 16 -8 26 -16 34 -20" />
        <path d="M 6 3 C 20 8 28 20 34 26" />
        <path d="M -3 5 C -10 18 -18 28 -24 34" />
        <path d="M -6 -2 C -18 -8 -26 -18 -34 -22" />
      </g>

      <!-- Central placental core -->
      <circle r="6" fill="#fdfaf3" stroke-width="0.8" stroke-opacity="0.5" />
      <circle r="2.5" fill="#b08a4a" fill-opacity="0.6" stroke="none" />

      <!-- ARCHIVAL SEED ARILS (FACETED RUBY SEEDS PACKED IN CHAMBERS) -->
      <!-- Chamber 1: Top chamber -->
      <g stroke-width="0.4" stroke="#4a0e16" stroke-opacity="0.65">
        <circle cx="8" cy="-28" r="2.8" fill="url(#seedGlow)" />
        <circle cx="15" cy="-22" r="2.7" fill="url(#seedGlow)" />
        <circle cx="9" cy="-16" r="2.9" fill="url(#seedGlow)" />
        <circle cx="17" cy="-14" r="2.6" fill="url(#seedGlow)" />
        <circle cx="23" cy="-18" r="2.8" fill="url(#seedGlow)" />
        <circle cx="27" cy="-10" r="2.5" fill="url(#seedGlow)" />
      </g>

      <!-- Chamber 2: Right chamber -->
      <g stroke-width="0.4" stroke="#4a0e16" stroke-opacity="0.65">
        <circle cx="26" cy="4" r="2.9" fill="url(#seedGlow)" />
        <circle cx="18" cy="8" r="2.7" fill="url(#seedGlow)" />
        <circle cx="28" cy="12" r="2.8" fill="url(#seedGlow)" />
        <circle cx="20" cy="18" r="2.6" fill="url(#seedGlow)" />
        <circle cx="27" cy="22" r="2.7" fill="url(#seedGlow)" />
        <circle cx="12" cy="16" r="2.5" fill="url(#seedGlow)" />
      </g>

      <!-- Chamber 3: Bottom chamber -->
      <g stroke-width="0.4" stroke="#4a0e16" stroke-opacity="0.65">
        <circle cx="6" cy="26" r="2.8" fill="url(#seedGlow)" />
        <circle cx="-2" cy="30" r="2.9" fill="url(#seedGlow)" />
        <circle cx="-10" cy="26" r="2.7" fill="url(#seedGlow)" />
        <circle cx="2" cy="18" r="2.8" fill="url(#seedGlow)" />
        <circle cx="-6" cy="20" r="2.6" fill="url(#seedGlow)" />
        <circle cx="-14" cy="18" r="2.7" fill="url(#seedGlow)" />
      </g>

      <!-- Chamber 4: Lower left chamber -->
      <g stroke-width="0.4" stroke="#4a0e16" stroke-opacity="0.65">
        <circle cx="-22" cy="12" r="2.8" fill="url(#seedGlow)" />
        <circle cx="-28" cy="6" r="2.7" fill="url(#seedGlow)" />
        <circle cx="-16" cy="4" r="2.6" fill="url(#seedGlow)" />
        <circle cx="-24" cy="-2" r="2.8" fill="url(#seedGlow)" />
        <circle cx="-30" cy="-6" r="2.7" fill="url(#seedGlow)" />
      </g>

      <!-- Chamber 5: Upper left chamber -->
      <g stroke-width="0.4" stroke="#4a0e16" stroke-opacity="0.65">
        <circle cx="-18" cy="-14" r="2.8" fill="url(#seedGlow)" />
        <circle cx="-24" cy="-18" r="2.9" fill="url(#seedGlow)" />
        <circle cx="-10" cy="-20" r="2.7" fill="url(#seedGlow)" />
        <circle cx="-16" cy="-26" r="2.8" fill="url(#seedGlow)" />
        <circle cx="-7" cy="-28" r="2.6" fill="url(#seedGlow)" />
      </g>

      <!-- Seed highlight facets -->
      <g fill="#ffffff" fill-opacity="0.45">
        <circle cx="7" cy="-29" r="0.8" />
        <circle cx="14" cy="-23" r="0.7" />
        <circle cx="25" cy="3" r="0.8" />
        <circle cx="5" cy="25" r="0.8" />
        <circle cx="-23" cy="11" r="0.7" />
        <circle cx="-19" cy="-15" r="0.8" />
      </g>

      <!-- Specimen Figure Label C -->
      <text x="-48" y="32" font-family="var(--mono), monospace" font-size="6.5" fill="#8a7a6b" letter-spacing="0.1em">Fig. C</text>
    </g>

    <!-- Fallen ripe seeds on specimen marble margin -->
    <g stroke="#4a0e16" stroke-width="0.4">
      <circle cx="316" cy="378" r="2.7" fill="url(#seedGlow)" />
      <circle cx="315.5" cy="377.2" r="0.8" fill="#fff" fill-opacity="0.4" stroke="none" />

      <circle cx="330" cy="392" r="2.4" fill="url(#seedGlow)" />
      <circle cx="329.5" cy="391.4" r="0.7" fill="#fff" fill-opacity="0.4" stroke="none" />

      <circle cx="308" cy="402" r="2.5" fill="url(#seedGlow)" />
      <circle cx="307.5" cy="401.3" r="0.7" fill="#fff" fill-opacity="0.4" stroke="none" />
    </g>

    <!-- Botanical Metric Scale (0 - 5 cm) -->
    <g transform="translate(42 414)" font-family="var(--mono), monospace" font-size="6.5" fill="#8a7a6b" stroke="none">
      <path d="M 0 0 H 60 M 0 -3 V 3 M 24 -2 V 2 M 60 -3 V 3" stroke="#8a7a6b" stroke-width="0.7" />
      <text x="0" y="10" text-anchor="middle">0</text>
      <text x="24" y="10" text-anchor="middle">2</text>
      <text x="60" y="10" text-anchor="middle">5 cm</text>
    </g>

  </g>
</svg>
