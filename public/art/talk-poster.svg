<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="tpTitle tpDesc">
  <title id="tpTitle">Talk poster — a quiet pomegranate</title>
  <desc id="tpDesc">A dark ink stage with a small, fine-line pomegranate branch and the title of Sam Kaveh's Rust physics engine talk.</desc>
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#241a15"/>
      <stop offset=".55" stop-color="#1b1512"/>
      <stop offset="1" stop-color="#100c0a"/>
    </linearGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c78d54" stop-opacity=".16"/>
      <stop offset="1" stop-color="#c78d54" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".32" fill="#f2dfc4" opacity=".08"/>
      <circle cx="3" cy="3" r=".26" fill="#f2dfc4" opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#stage)"/>
  <rect width="1280" height="720" fill="url(#grain)"/>
  <ellipse cx="1000" cy="330" rx="380" ry="320" fill="url(#warm)"/>

